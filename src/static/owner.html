
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tobhe | Business Oversight</title>
    <link rel="stylesheet" href="/static/owner.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>
<body>
    <header class="hero">
        <div class="brand">
            <img
                src="/static/tobhe.jpg"
                alt="Traditional Tobhe lamp"
                class="brand-icon"
            >
            <h1>Tobhe</h1>
            <p>Shining a light on your business.</p>
        </div>
    </header>
    <nav class="main-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/#branches-section">Customer</a>
        <a href="/employee">Employee</a>
        <a href="/owner">Owner</a>
    </nav>

    <main class="dashboard">
        <section class="welcome-section">
            <h2>Business Overview</h2>
            <p>Select a branch to manage its daily operations.</p>
        </section>

        <section class="branches-section">
            <h3>Your Branches</h3>

            <div id="branches-container" class="branches-grid">
                <p>Loading your branches...</p>
            </div>
        </section>
        <section id="daily-setup-section" class="daily-setup-section" hidden>
            <h3>Daily Business Setup</h3>
            <p id="selected-branch-name"></p>
            
            <form id="daily-setup-form">
                <label for="business-date">Select report date</label>
                <input
                    type="date"
                    id="business-date"
                    name="business_date"
                    required
                >
                <input
                    type="hidden"
                    id="selected-branch-id"
                    name="branch_id"
                >
                <button type="submit" class="branch-button">
                    View Daily Report
                </button>
        </form>

            <div id="daily-setup-result" role="status"></div>
        </section>


        <p id="status-message" role="status"></p>

        <footer class="page-footer">
            Welcome to Tobhe. Your business, our focus.
        </footer>
    </main>

    <script src="/static/owner.js"></script>
</body>
</html>
